<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 116 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="nl-beam" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nl-body" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
