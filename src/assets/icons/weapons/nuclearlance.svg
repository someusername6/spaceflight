                        L 0,-14.4
                        A 14.4,14.4 0 0 1 12.47,-7.2
                        L 3.9,-2.25
                        A 4.5,4.5 0 0 0 0,-4.5 Z" />
  </defs>

  <g stroke="#fff" filter="url(#nl-beam)">
    <path d="M34 16 H94"/>
    <path d="M84 6 V26"/>
    <path d="M92.66 21 L 75.34 11"/>
    <path d="M89 24.66 L 79 7.34"/>
    <path d="M75.34 21 L 92.66 11"/>
    <path d="M79 24.66 L 89 7.34"/>
  </g>

  <g transform="translate(-32 0)" filter="url(#nl-body)">
    <circle cx="48" cy="16" r="2.7" fill="currentColor" />
    <g fill="currentColor">
      <use href="#blade" transform="rotate(30, 48, 16) translate(48, 16)" />
      <use href="#blade" transform="rotate(150, 48, 16) translate(48, 16)" />
      <use href="#blade" transform="rotate(270, 48, 16) translate(48, 16)" />
