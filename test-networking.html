<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Networking Test - Phase 4</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #4fc3f7; }
    .section {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      background: #4fc3f7;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover { background: #81d4fa; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f23;
      color: #eee;
      margin-right: 10px;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
    .status.idle { background: #333; }
    .status.connecting { background: #f57c00; color: #000; }
    .status.connected { background: #4caf50; color: #000; }
    .status.error { background: #f44336; }
    #log {
      background: #0f0f23;
      padding: 15px;
      border-radius: 4px;
      height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .log-entry { margin-bottom: 5px; }
    .log-info { color: #4fc3f7; }
    .log-success { color: #4caf50; }
    .log-error { color: #f44336; }
    .log-message { color: #ff9800; }
    #roomCode {
      font-size: 24px;
      font-weight: bold;
      color: #4fc3f7;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>Phase 4: Networking Test</h1>

  <div class="section">
    <h2>Connection</h2>
    <div>
      <button id="createBtn">Create Room</button>
      <button id="joinBtn">Join Room</button>
      <input type="text" id="joinCode" placeholder="Room Code" maxlength="8" style="text-transform: uppercase;">
      <button id="disconnectBtn" disabled>Disconnect</button>
    </div>
    <div class="status idle" id="status">Status: Idle</div>
    <div style="margin-top: 15px;">
      Room Code: <span id="roomCode">-</span>
    </div>
    <div>
      Local Peer ID: <span id="localPeerId">-</span>
    </div>
    <div>
      Connected Peers: <span id="connectedPeers">-</span>
    </div>
  </div>

  <div class="section">
    <h2>Messaging</h2>
    <input type="text" id="messageInput" placeholder="Type a message..." style="width: 300px;">
    <button id="sendBtn" disabled>Send to All</button>
  </div>

  <div class="section">
    <h2>Log</h2>
    <button id="clearLog">Clear Log</button>
    <div id="log"></div>
  </div>

  <script type="module">
    import {
      createConnectionFlow,
      DEFAULT_NETWORKING_CONFIG
    } from './src/multiplayer/networking/index.ts';

    // State
    let connectionFlow = null;

    // DOM elements
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const joinCodeInput = document.getElementById('joinCode');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDiv = document.getElementById('status');
    const roomCodeSpan = document.getElementById('roomCode');
    const localPeerIdSpan = document.getElementById('localPeerId');
    const connectedPeersSpan = document.getElementById('connectedPeers');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const logDiv = document.getElementById('log');
    const clearLogBtn = document.getElementById('clearLog');

    // Logging
    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateStatus(state) {
      statusDiv.className = 'status';
      switch (state.status) {
        case 'idle':
          statusDiv.textContent = 'Status: Idle';
          statusDiv.classList.add('idle');
          break;
        case 'creating-room':
          statusDiv.textContent = 'Status: Creating room...';
          statusDiv.classList.add('connecting');
          break;
        case 'joining-room':
          statusDiv.textContent = `Status: Joining room ${state.roomCode}...`;
          statusDiv.classList.add('connecting');
          break;
        case 'signaling':
          statusDiv.textContent = `Status: Signaling (room: ${state.roomCode})`;
          statusDiv.classList.add('connecting');
          break;
        case 'forming-mesh':
          statusDiv.textContent = `Status: Forming mesh (${state.connectedPeers}/${state.totalPeers} peers)`;
          statusDiv.classList.add('connecting');
          break;
        case 'connected':
          statusDiv.textContent = `Status: Connected to room ${state.roomCode}`;
          statusDiv.classList.add('connected');
          break;
        case 'error':
          statusDiv.textContent = `Status: Error - ${state.error.message}`;
          statusDiv.classList.add('error');
          break;
      }
    }

    function updateUI(result = null) {
      // Use result if provided, otherwise get from connection flow state
      const roomCode = result?.roomCode ?? connectionFlow?.state.roomCode;
      const localPeerId = result?.localPeerId ?? connectionFlow?.getSignalingClient()?.localPeerId;

      roomCodeSpan.textContent = roomCode || '-';
      localPeerIdSpan.textContent = localPeerId || '-';

      const transport = connectionFlow?.getTransport();
      if (transport) {
        const peers = [...transport.connectedPeers];
        connectedPeersSpan.textContent = peers.length > 0 ? peers.join(', ') : 'None';
      } else {
        connectedPeersSpan.textContent = '-';
      }

      const isConnected = connectionFlow?.state.status === 'connected';
      createBtn.disabled = isConnected;
      joinBtn.disabled = isConnected;
      disconnectBtn.disabled = !connectionFlow || connectionFlow.state.status === 'idle';
      sendBtn.disabled = !isConnected;
    }

    function resetUI() {
      roomCodeSpan.textContent = '-';
      localPeerIdSpan.textContent = '-';
      connectedPeersSpan.textContent = '-';
      updateStatus({ status: 'idle' });
      createBtn.disabled = false;
      joinBtn.disabled = false;
      disconnectBtn.disabled = true;
      sendBtn.disabled = true;
    }

    // Create room
    createBtn.addEventListener('click', async () => {
      log('Creating room...');

      connectionFlow = createConnectionFlow({
        signaling: {
          serverUrl: DEFAULT_NETWORKING_CONFIG.signaling.serverUrl,
          pollIntervalMs: DEFAULT_NETWORKING_CONFIG.signaling.pollIntervalMs,
        }
      }, {
        onStateChange: (state) => {
          log(`State: ${state.status}`);
          updateStatus(state);
        }
      });

      try {
        const result = await connectionFlow.createRoom();
        log(`Room created: ${result.roomCode}`, 'success');
        log(`Host ID: ${result.localPeerId}`);
        updateUI(result);
        setupTransportCallbacks();
      } catch (error) {
        log(`Error: ${error.message}`, 'error');
        resetUI();
      }
    });

    // Join room
    joinBtn.addEventListener('click', async () => {
      const code = joinCodeInput.value.toUpperCase().trim();
      if (code.length !== 8) {
        log('Please enter an 8-character room code', 'error');
        return;
      }

      log(`Joining room ${code}...`);

      connectionFlow = createConnectionFlow({
        signaling: {
          serverUrl: DEFAULT_NETWORKING_CONFIG.signaling.serverUrl,
          pollIntervalMs: DEFAULT_NETWORKING_CONFIG.signaling.pollIntervalMs,
        }
      }, {
        onStateChange: (state) => {
          log(`State: ${state.status}`);
          updateStatus(state);
        }
      });

      try {
        const result = await connectionFlow.joinRoom(code);
        log(`Joined room: ${result.roomCode}`, 'success');
        log(`Guest ID: ${result.localPeerId}`);
        log(`Host ID: ${result.hostPeerId}`);
        updateUI(result);
        setupTransportCallbacks();
      } catch (error) {
        log(`Error: ${error.message}`, 'error');
        resetUI();
      }
    });

    // Disconnect
    disconnectBtn.addEventListener('click', async () => {
      log('Disconnecting...');
      if (connectionFlow) {
        await connectionFlow.disconnect();
        connectionFlow.dispose();
        connectionFlow = null;
      }
      resetUI();
      log('Disconnected', 'success');
    });

    // Setup transport callbacks
    function setupTransportCallbacks() {
      const transport = connectionFlow?.getTransport();
      if (!transport) return;

      transport.onConnect = (peerId) => {
        log(`Peer connected: ${peerId}`, 'success');
        updateUI();
      };

      transport.onDisconnect = (peerId) => {
        log(`Peer disconnected: ${peerId}`, 'error');
        updateUI();
      };

      transport.onMessage = (peerId, data) => {
        const text = new TextDecoder().decode(data);
        log(`Message from ${peerId}: ${text}`, 'message');
      };
    }

    // Send message
    sendBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (!text) return;

      const transport = connectionFlow?.getTransport();
      if (!transport) {
        log('Not connected', 'error');
        return;
      }

      const data = new TextEncoder().encode(text);
      transport.broadcast(data, true);
      log(`Sent: ${text}`, 'success');
      messageInput.value = '';
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // Clear log
    clearLogBtn.addEventListener('click', () => {
      logDiv.innerHTML = '';
    });

    // Initial state
    log('Ready. Start the signaling server: cd server/signaling && npm run dev');
  </script>
</body>
</html>
